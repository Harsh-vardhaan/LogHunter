[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loghunter"
dynamic = ["version"]
description = "A local CLI security log parser with transparent rule-based detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
loghunter = "loghunter.cli:main"

[tool.setuptools.packages.find]
include = ["loghunter*"]

[tool.setuptools.dynamic]
version = {attr = "loghunter.__version__"}
